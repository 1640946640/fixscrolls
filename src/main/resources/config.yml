# 支持修复的物品ID列表
# 可以添加更多Minecraft物品ID，包括Mod物品
ids:
  - 257  # 铁镐
  - 270  # 钻石镐
  - 274  # 铁斧
  - 278  # 钻石斧
  - 285  # 铁锄

# 防连点器阈值（毫秒）
# 当玩家点击间隔小于此值时，会被视为使用连点器
threshold: 200

# 修复卷轴的显示名称
# 支持颜色代码，使用&符号
name: "&d&l修理卷轴"

# 修复卷轴的物品类型ID
# 339 代表纸
item: 339

# 修复卷轴的描述文本
# %dur% 会被替换为实际的耐久值
lore:
  - "&e当物品耐久低于80%时"
  - "&e将会自动补满耐久值!"
  - "&a剩余耐久值: %dur%"
